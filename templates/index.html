<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Informe de Ventas</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #E0BBE4;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin: 40px 0 30px 0;
      color: #3D2A8C;
      font-weight: bold;
    }

    .grafica {
      margin-bottom: 40px;
    }

    .grafica iframe,
    .grafica img {
      width: 100%;
      height: auto;
      max-height: 600px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      color: #3D2A8C;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
    }

    .grafica-container {
      cursor: help;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Informe de Ventas</h1>
    <div class="row">
      {% for grafica in graficas %}
        <div class="col-12 grafica">
          <div class="card">
            <h5 class="card-title">{{ grafica.titulo }}</h5>
            <div class="grafica-container" title="{{ grafica.descripcion }}">
              {{ grafica.html|safe }}
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
